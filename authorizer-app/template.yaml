AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda authorizer do API Gateway (HTTP API do repo K8S). Exige JWT valido do Auth0 com a
  claim cpf; as rotas de RotasSemCpf (cadastro de cliente) aceitam JWT valido sem a claim.

Parameters:
  Auth0Domain:
    Type: String
    Description: Dominio do tenant Auth0, sem https:// (ex. dev-xxxx.us.auth0.com)
  Auth0Audience:
    Type: String
    Description: Audience (identifier) da API no Auth0
  RotasSemCpf:
    Type: String
    Default: POST /monolith/api/clientes
    Description: Rotas "METODO /path", separadas por virgula, que aceitam JWT sem a claim cpf

Resources:
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Nome fixo: o authorizer do API Gateway (repo K8S) referencia a funcao por ele
      FunctionName: techchallenge-oficina-authorizer
      CodeUri: ./src/Authorizer/
      Handler: Authorizer::Authorizer.Function::FunctionHandler
      Runtime: dotnet10
      Architectures:
        - x86_64
      MemorySize: 512
      # O API Gateway espera o authorizer por no maximo 10 s
      Timeout: 10
      Environment:
        Variables:
          AUTH0_DOMAIN: !Ref Auth0Domain
          AUTH0_AUDIENCE: !Ref Auth0Audience
          ROTAS_SEM_CPF: !Ref RotasSemCpf

  # Permite que o API Gateway invoque o authorizer. O id da API fica com curinga porque muda
  # sempre que o repo K8S recria o ambiente
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*

Outputs:
  AuthorizerFunctionArn:
    Description: ARN do Lambda authorizer
    Value: !GetAtt AuthorizerFunction.Arn
